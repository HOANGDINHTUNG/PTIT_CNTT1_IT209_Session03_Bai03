server {
    listen 80;
    server_name my-web.local; # Thay thế bằng IP hoặc Domain thực tế

    root /var/www/my-web/html;
    index index.html index.htm;

    # Cấu hình website tĩnh mặc định
    location / {
        try_files $uri $uri/ =404;
    }

    # -------------------------------------------------------------
    # Cấu hình bảo vệ thư mục /admin bằng HTTP Basic Authentication
    # -------------------------------------------------------------
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd; # Đường dẫn tới file mật khẩu mã hóa
        
        try_files $uri $uri/ =404;
    }
}
